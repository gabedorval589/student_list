<html>
    <head>
      <title>This is an AQA student list.</title>  
    </head>
    <body>
        <h1>Unordered list.</h1>
        <ul>
            {%- for student in students -%}
                <li>{{student.name}}</li>
            {%- endfor -%}
        </ul>
        <ol>
            <li>Coffee</li>
            <li>Tea</li>
            <li>Milk</li>
        </ol>
    </body>
</html>
